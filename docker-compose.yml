# =====================================================================
# ISO / ISOV - Dis Kaynak Izleme ve Ozet Botu
# Port haritasi docs/CONTRACT.md ile ayni tutulmali.
# =====================================================================
services:

  # ------------------------------------------------------------------
  # Veri katmani - MySQL 8
  # Not: --default-time-zone=+03:00 -> NOW() ve DEFAULT CURRENT_TIMESTAMP
  # degerleri uygulamanin kullandigi TRT ile ayni olsun; "her yer GMT+3".
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: isov-db
    restart: unless-stopped
    command: >
      --default-time-zone=+03:00
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-ft-min-token-size=2
    environment:
      TZ: Europe/Istanbul
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-isov_root}
      MYSQL_DATABASE: ${DB_NAME:-isov}
      MYSQL_USER: ${DB_USER:-isov}
      MYSQL_PASSWORD: ${DB_PASSWORD:-isov_pass}
    ports:
      - "127.0.0.1:${DB_PORT:-3312}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Sirali calisir: 01 sema, 02 etiket sozlugu
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-isov_root}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - isov

  # ------------------------------------------------------------------
  # Vektor deposu - semantik tekillestirme icin (opsiyonel katman)
  # simhash + jaccard yeterli olmadiginda embedding tabanli kumeleme.
  # ------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: isov-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6335}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - isov

  # ------------------------------------------------------------------
  # Backend - Express.js REST API
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: isov-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      TZ: Europe/Istanbul
      NODE_ENV: production
      PORT: 5005
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-isov}
      DB_USER: ${DB_USER:-isov}
      DB_PASSWORD: ${DB_PASSWORD:-isov_pass}
      # Seed dosyalari konteynerde /app/seed'e baglanir (asagidaki volume).
      # Varsayilan host yolu oldugu icin acikca verilmeli; aksi halde
      # `docker compose exec backend npm run seed` klasoru bulamiyor.
      SEED_DIR: /app/seed
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-isov_articles}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Semantik (diller arasi) tekillestirme ---------------------
      # Sozcuksel dedup'in USTUNE calisan ek katman. Model ya da Qdrant
      # yoksa sistem eskisi gibi calisir, sadece semantik kume olusmaz.
      SEMANTIC_DEDUP_ENABLED: ${SEMANTIC_DEDUP_ENABLED:-true}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.935}
      SEMANTIC_MAX_DAY_GAP: ${SEMANTIC_MAX_DAY_GAP:-4}
      SEMANTIC_REQUIRE_NUMERIC_AGREEMENT: ${SEMANTIC_REQUIRE_NUMERIC_AGREEMENT:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Xenova/multilingual-e5-base}
      # Model dosyalari named volume'da; her baslatmada yeniden inmez.
      EMBEDDING_CACHE_DIR: /app/.cache/models
      EMBEDDING_LOAD_TIMEOUT_MS: ${EMBEDDING_LOAD_TIMEOUT_MS:-300000}
      # --- SUNUCU TARAFI PDF (Chromium) ------------------------------
      # Imajda /usr/bin/chromium kurulu (bkz. backend/Dockerfile). Yol
      # burada da acikca veriliyor: ayni imaj baska bir ortamda paketli
      # Chromium ile kosarsa tek satir degistirmek yeterli olsun.
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      # PDF_ENABLED=false -> pdfService.isAvailable() false doner, uc 503
      # verir ve sistemin geri kalani etkilenmez (bozulma yolu boyle test edildi).
      PDF_ENABLED: ${PDF_ENABLED:-true}
      # Tarayici bosta bu sure sonra kapanir (bellek geri verilir).
      PDF_IDLE_TIMEOUT_MS: ${PDF_IDLE_TIMEOUT_MS:-300000}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-45000}

      # --- SMTP / E-POSTA --------------------------------------------
      # ONCELIK: app_settings.smtp (admin panelinden, sifre AES-256-GCM)
      # sonra bu env degiskenleri. Ikisi de yoksa mailService
      # `available:false` doner ve hicbir yer COKMEZ; gonderim denenmez.
      # DIKKAT: app_settings'teki sifreli SMTP sifresinin cozulebilmesi
      # icin SETTINGS_SECRET tanimli olmali (yonetim ayarlari katmani).
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Ayni aliciya dakikada azami e-posta.
      MAIL_RATE_PER_MINUTE: ${MAIL_RATE_PER_MINUTE:-5}
      # E-postadaki haber baglantilarinin tabani.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://hackathon.dhsyazilim.com}

      # --- BULTEN ZAMANLAYICISI --------------------------------------
      # VARSAYILAN KAPALI: demo sirasinda istenmeyen gonderim olmasin.
      # Zamanlayici AYRI SUREC olarak kosar:
      #   docker compose exec -e DIGEST_SCHEDULER_ENABLED=true backend npm run scheduler
      # Elle tek seferlik gonderim: npm run send-digest -- --dry-run
      DIGEST_SCHEDULER_ENABLED: ${DIGEST_SCHEDULER_ENABLED:-false}
      DIGEST_TICK_MS: ${DIGEST_TICK_MS:-60000}
      DIGEST_CONCURRENCY: ${DIGEST_CONCURRENCY:-3}
      # Bultene gorsel PDF eki eklensin mi (format='tam' kullanicilar icin).
      DIGEST_ATTACH_PDF: ${DIGEST_ATTACH_PDF:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5005}:5005"
    # Chromium'un paylasimli bellegi. `--disable-dev-shm-usage` ile zaten
    # diske dusuyoruz ama Docker'in 64 MB varsayilani coK sayfali PDF'te
    # sekmeyi sessizce oldurebiliyor; 256 MB ucuz sigorta.
    shm_size: 256m
    volumes:
      # Seed dosyalari salt-okunur baglanir; `npm run seed` bunlari okur.
      - ./seed:/app/seed:ro
      # Uretilen PDF'ler AKISLA donduruldugu icin kalici depo GEREKMIYOR;
      # yalnizca CLI islerinin diske yazdigi gecici ciktilar icin klasor.
      - pdf_out:/app/var/pdf
      # Embedding modeli onbellegi — ~1,1 GB, konteyner yeniden kurulsa da kalir.
      - model_cache:/app/.cache/models
    # Docker'in gomulu DNS'i dis cozumlemede flake edebiliyor; sabit upstream
    # verildiginde servis kesfi (db/qdrant) yine 127.0.0.11 uzerinden calisir.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - isov
      - proxy

  # ------------------------------------------------------------------
  # Frontend - Next.js 15 (standalone cikti)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: isov-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Europe/Istanbul
      NODE_ENV: production
      # Sunucu tarafi (RSC) cagrilari konteyner agi uzerinden
      API_BASE_URL: http://backend:5005/api
      # Tarayici tarafi cagrilar Next rewrite'i uzerinden -> /api
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3005}:3000"
    networks:
      - isov
      - proxy

volumes:
  db_data:
  qdrant_data:
  # Embedding modeli onbellegi (HuggingFace indirmeleri)
  model_cache:
  # CLI isleri (send-digest --pdf-out gibi) diske PDF yazarsa burada durur.
  pdf_out:

networks:
  isov:
    name: isov
  # Nginx Proxy Manager'in bulundugu mevcut ag; hackathon.dhsyazilim.com
  # yonlendirmesi bu ag uzerinden isov-frontend:3000'e baglanir.
  proxy:
    name: proxy_default
    external: true
